<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 18px;
      color: #202124;
    }

    h2 {
      margin-top: 0;
      color: #1a73e8;
    }

    input,
    select {
      width: 100%;
      padding: 9px;
      box-sizing: border-box;
      margin-bottom: 10px;
      border: 1px solid #dadce0;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      background: #1a73e8;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .edit-button{
      margin-top:10px;
      width:100%;
      background:#188038;
    }

    .delete-button {
      margin-top: 8px;
      width: 100%;
      background: #d93025;
    }

    .delete-button:hover {
      background: #b3261e;
    }

    button:disabled {
      background: #9aa0a6;
      cursor: wait;
    }

    #message {
      margin-top: 14px;
      color: #5f6368;
    }

    .card {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      background: #f8f9fa;
    }

    .company {
      font-size: 16px;
      font-weight: bold;
    }

    .position {
      margin-top: 4px;
    }

    .details {
      margin-top: 8px;
      font-size: 12px;
      color: #5f6368;
    }
  </style>
</head>

<body>
  <h2>🔍 Search Applications</h2>

  <label>Company</label>
<input
  id="company"
  type="text"
  placeholder="Enter company name"
  onkeydown="handleKeydown(event)"
>

<label>Status</label>
<select id="status">
  <option value="">Any</option>
  <option>Applied</option>
  <option>Assessment</option>
  <option>HR Interview</option>
  <option>Technical Interview</option>
  <option>Final Interview</option>
  <option>Offer</option>
  <option>Accepted</option>
  <option>Rejected</option>
  <option>Withdrawn</option>
</select>

<label>Platform</label>
<select id="platform">
  <option value="">Any</option>
  <option>LinkedIn</option>
  <option>JobStreet</option>
  <option>Indeed</option>
  <option>Company Website</option>
  <option>Referral</option>
  <option>Other</option>
</select>

<label>Work Type</label>
<select id="workType">
  <option value="">Any</option>
  <option>Remote</option>
  <option>Hybrid</option>
  <option>On-site</option>
</select>

<button id="searchButton" onclick="runSearch()">
  Search
</button>

  <div id="message"></div>
  <div id="results"></div>

  <script>
    function handleKeydown(event) {
      if (event.key === "Enter") {
        runSearch();
      }
    }

function runSearch() {
  const filters = {
    company: document
      .getElementById("company")
      .value
      .trim(),

    status: document
      .getElementById("status")
      .value,

    platform: document
      .getElementById("platform")
      .value,

    workType: document
      .getElementById("workType")
      .value
  };

  const button = document.getElementById("searchButton");
  const message = document.getElementById("message");
  const results = document.getElementById("results");

  button.disabled = true;
  button.textContent = "Searching...";
  message.textContent = "";
  results.innerHTML = "";

  google.script.run
    .withSuccessHandler(function (applications) {
      button.disabled = false;
      button.textContent = "Search";

      displayResults(applications);
    })
    .withFailureHandler(function (error) {
      button.disabled = false;
      button.textContent = "Search";

      message.textContent =
        "Search failed: " + (error.message || error);
    })
    .searchApplications(filters);
}

    function displayResults(applications) {
      const message = document.getElementById("message");
      const results = document.getElementById("results");

      results.innerHTML = "";

      if (!applications || applications.length === 0) {
        message.textContent = "No matching applications found.";
        return;
      }

      message.textContent =
        applications.length + " result(s) found.";

      applications.forEach(function (application) {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML =
          '<div class="company">' +
          escapeHtml(application.company) +
          '</div>' +

          '<div class="position">' +
          escapeHtml(application.position) +
          '</div>' +

          '<div class="details">' +
          'ID: ' + escapeHtml(application.applicationId) +
          '<br>Status: ' + escapeHtml(application.status) +
          '<br>Platform: ' + escapeHtml(application.platform) +
          '<br>Work type: ' + escapeHtml(application.workType) +
          '<br>Date applied: ' + escapeHtml(application.dateApplied) +
          '</div>' +

          '<button class="edit-button" onclick="openEditForm(\'' + escapeHtml(application.applicationId) + '\')">' + '✏ Edit' +
          '</button>' +

          '<button class="delete-button" onclick="confirmDelete(\'' + escapeHtml(application.applicationId) + '\', \'' + escapeHtml(application.company) + '\')">' +'🗑 Delete' +
          '</button>';

        results.appendChild(card);
      });
    }
    
    function openEditForm(applicationId){

    google.script.run
    .withFailureHandler(function(error){

      document.getElementById("message").textContent =
        error.message || error;

    })
    .showEditApplicationSidebar(applicationId);

    }

    function confirmDelete(applicationId, company) {
  const confirmed = window.confirm(
    "Delete this application?\n\n" +
    "Company: " + company + "\n" +
    "Application ID: " + applicationId + "\n\n" +
    "This action cannot be undone."
  );

  if (!confirmed) {
    return;
  }

  const message = document.getElementById("message");

  message.textContent = "Deleting application...";

  google.script.run
    .withSuccessHandler(function () {
      message.textContent =
        "Application " + applicationId + " was deleted.";

      runSearch();
    })
    .withFailureHandler(function (error) {
      message.textContent =
        "Delete failed: " + (error.message || error);
    })
    .deleteApplication(applicationId);
}

    function escapeHtml(value) {
      const element = document.createElement("div");
      element.textContent = String(value || "");
      return element.innerHTML;
    }
  </script>
</body>
</html>
